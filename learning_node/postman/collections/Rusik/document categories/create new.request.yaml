$kind: http-request
url: "{{base_url}}/v1/document-categories"
method: POST
queryParams:
  - key: email
    value: superadmin@rusik.gov.my
    disabled: true
  - key: searchTerm
    value: super
    disabled: true
body:
  type: json
  content: "{\r

    \    \"name\": \"New Category\",\r

    \    \"slug\": \"new-category\",\r

    \    \"description\": \"Category for new\",\r

    \    \"sortOrder\":6,\r

    \    \"isActive\": true\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 3000
