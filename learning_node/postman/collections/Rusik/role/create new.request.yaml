$kind: http-request
url: "{{base_url}}/v1/roles"
method: POST
queryParams:
  - key: email
    value: superadmin@rusik.gov.my
    disabled: true
  - key: searchTerm
    value: super
    disabled: true
body:
  type: json
  content: "{\r

    \    \"name\": \"Researcher\",\r

    \    \"slug\": \"researcher\",\r

    \    \"description\": \"Research and submit report\",\r

    \    \"isSystem\": false,\r

    \    \"rules\":[\r

    \        \"*:*\"\r

    \    ]\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 2000
